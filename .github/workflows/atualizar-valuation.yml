name: Atualizar Valuation B3

# Por que não um cron a cada 10 min?
# O GitHub trata `schedule` como "melhor esforço": em horários de pico ele atrasa disparos
# por horas ou simplesmente os descarta (na prática, ~1 a 3 de ~20 disparos por dia rodavam).
# Por isso a atualização roda como UMA sessão contínua durante o pregão (.github/scripts/motor.sh):
#   - basta um disparo pegar para cobrir o dia inteiro;
#   - crons de redundância a cada hora reiniciam a sessão se ela cair (se já houver uma
#     rodando, ficam na fila do grupo de concorrência e assumem quando ela terminar);
#   - perto do limite de 6 h do runner, a sessão dispara a própria continuação.
# Os dados são publicados no branch `dados`, não na main, para não disparar um deploy do
# GitHub Pages a cada ciclo (o site lê o JSON direto do branch via raw.githubusercontent.com).

on:
  schedule:
    # Abertura da sessão (09h50 BRT = 12h50 UTC)
    - cron: "50 12 * * 1-5"
    # Redundância horária durante o pregão (11h07 a 17h07 BRT)
    - cron: "7 14-20 * * 1-5"
    # Fechamento consolidado (18h25 BRT = 21h25 UTC)
    - cron: "25 21 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = build único agora · cotacoes = só preços (~15 s) · sessao = laço contínuo do pregão"
        type: choice
        options: [completo, cotacoes, sessao]
        default: completo

concurrency:
  group: atualizar-valuation
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  atualizar-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Executar testes unitários do motor
        run: python -m pytest -q engine/tests

      - name: Executar motor de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '25 21 * * 1-5' && 'completo') || 'sessao' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .github/scripts/motor.sh "$RUNNER_TEMP/motor.sh"
          bash "$RUNNER_TEMP/motor.sh"
