name: Atualizar Valuation B3

on:
  schedule:
    # Roda de segunda a sexta-feira às 21:00 UTC (18:00 BRT, após fechamento do pregão da B3)
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-valuation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Executar testes unitários do motor
        run: python -m pytest -v engine/tests/test_valuation.py

      - name: Gerar data/valuation.json
        run: python -m engine.build

      - name: Commit e push de data/valuation.json se houver mudança
        run: |
          if git diff --quiet -I '"gerado_em":' -- data/valuation.json; then
            echo "Nenhuma alteração nos dados de valuation. Commit ignorado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/valuation.json
            git commit -m "chore: atualiza data/valuation.json"
            git push
          fi
